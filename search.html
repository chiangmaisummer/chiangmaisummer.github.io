<script>
(async function(){
  const isZh = location.pathname.endsWith('-zh.html'); // 仅用于语言切换按钮
  const data = await fetch('search-index.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>[]);
  const qEl = document.getElementById('q');
  const out = document.getElementById('results');
  const hint = document.getElementById('hint');

  function norm(s){return (s||'').toLowerCase()}
  function matchScore(item, q){
    let s = 0;
    const nq = norm(q);
    if (norm(item.title).includes(nq)) s+=3;
    if (norm(item.desc).includes(nq)) s+=2;
    if (norm(item.lang)===('zh') && /[\u4e00-\u9fa5]/.test(q)) s+=1;
    if (norm(item.lang)===('en') && !/[\u4e00-\u9fa5]/.test(q)) s+=1;
    return s;
  }
  function hi(text, q){
    if(!q) return text;
    const esc = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return text.replace(new RegExp(esc,'ig'),m=>`<mark>${m}</mark>`);
  }
  function render(q){
    out.innerHTML = '';
    const qq = q.trim();
    if(!qq){ hint.style.display='block'; return; }
    hint.style.display='none';
    const results = data
      .map(item=>({item,score:matchScore(item,qq)}))
      .filter(r=>r.score>0)
      .sort((a,b)=>b.score-a.score);
    if(!results.length){ out.innerHTML='<p class="hint">No results / 暂无结果</p>'; return; }
    results.forEach(({item})=>{
      const div = document.createElement('div');
      div.className='result reveal';
      div.innerHTML = `
        <a class="link" href="${item.url}">${hi(item.title,qq)}</a>
        <div class="hint">${hi(item.desc,qq)}</div>
      `;
      out.appendChild(div);
    });
  }
  qEl.addEventListener('input', ()=>render(qEl.value));
  document.getElementById('clearBtn').addEventListener('click', e=>{e.preventDefault(); qEl.value=''; render(''); qEl.focus();});

  // 初始根据 URL ?q= 预填
  const params = new URLSearchParams(location.search);
  const initQ = params.get('q') || '';
  if(initQ){ qEl.value = initQ; render(initQ); }
})();
</script>
